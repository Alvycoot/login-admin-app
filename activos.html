<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Rajdhani:wght@600;700&family=Saira:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="estilos-formal.css">
</head>
<body class="pagina-app">
  <!-- Oculto hasta comprobar la sesión: así nadie ve la página ni un instante sin haber entrado. -->
  <header class="cabecera" id="cabecera" hidden>
    <div class="franja-circuitos">
      <!-- Corriente por los circuitos: las mismas pistas que en el login, en el recorte superior de la imagen -->
      <svg class="circuitos" viewBox="0 0 2752 240" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <mask id="mascara-cabecera" maskUnits="userSpaceOnUse" x="0" y="0" width="2752" height="240">
            <image href="img/cabecera-mascara.png" x="0" y="0" width="2752" height="240"/>
          </mask>
          <g id="pistas-izq">
            <path class="pista" d="M34 250V69L76 27H580" style="--fin: 1644; --dur: 11.4s; --d: 3.5s"/>
            <path class="pista" d="M55 250V81L86 50H521" style="--fin: 1398; --dur: 9.9s; --d: 0s"/>
            <path class="pista" d="M428 70L462 104H607L623 88H753" style="--fin: 1096; --dur: 7.8s; --d: 1.2s"/>
            <path class="pista" d="M387 70L440 124H633" style="--fin: 1169; --dur: 8.3s; --d: 4.6s"/>
            <path class="pista" d="M354 70L426 144H703" style="--fin: 980; --dur: 7s; --d: 2.4s"/>
            <path class="pista" d="M296 50L409 165H680" style="--fin: 1182; --dur: 8.3s; --d: 5.8s"/>
            <path class="pista" d="M284 124H340L413 198H753" style="--fin: 1400; --dur: 9.8s; --d: .6s"/>
            <path class="pista" d="M285 154H369L413 198H753" style="--fin: 1536; --dur: 10.7s; --d: 6.9s"/>
          </g>
        </defs>
        <g mask="url(#mascara-cabecera)">
          <use href="#pistas-izq"/>
          <use href="#pistas-izq" transform="translate(2752 0) scale(-1 1)" style="--extra: 2.9s"/>
          <path class="pista" d="M316 70H565L606 27H2146L2187 70H2437" style="--fin: 2758; --dur: 18.9s; --d: 1.8s"/>
        </g>
      </svg>
    </div>

    <div class="cabecera-contenido aparece">
      <div>
        <p class="eyebrow">Gestión de activos</p>
        <h1>Activos</h1>
      </div>
      <div class="usuario">
        <span class="usuario-nombre" id="nombre-usuario"></span>
        <span class="sombra-pildora"><span class="pildora" id="rol-usuario"></span></span>
        <button type="button" class="boton-linea" id="boton-salir"><span class="borde-acento"></span>Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="trabajo" id="contenido" hidden>
    <!-- Plantilla del pie de la ficha: el icono del reloj se copia de aquí (sin construir HTML a mano en JavaScript) -->
    <template id="plantilla-registrada">
      <span class="registrada"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Consulta registrada a tu nombre</span>
    </template>
    <!-- Lo que ve quien tiene la sección Activos: el buscador (paso 2) y sus resultados -->
    <section class="barra aparece-2" id="barra">
      <div class="buscador">
        <label for="texto-busqueda">Buscar activos</label>
        <input type="search" id="texto-busqueda" placeholder="Código, dirección o municipio" autocomplete="off">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      </div>
      <dl class="permisos">
        <dt>Lees</dt>
        <dd id="secciones-lectura"></dd>
        <dt>Escribes</dt>
        <dd id="secciones-escritura"></dd>
      </dl>
      <div class="barra-acciones">
        <!-- Solo para quien puede escribir activos (paso 4) -->
        <div class="zona-boton" id="zona-crear" hidden>
          <span class="halo" aria-hidden="true"></span>
          <div class="sombra"><button type="button" class="boton-relieve" id="boton-crear">+ Nuevo activo</button></div>
        </div>
        <!-- Solo para el administrador. En la barra y no en la cabecera, donde no cabe junto a "Cerrar sesión";
             en el panel, "Ir a Activos" ocupa el mismo sitio -->
        <button type="button" class="boton-linea" id="boton-panel" hidden><span class="borde-acento"></span>Panel del admin</button>
      </div>
    </section>

    <div class="columnas" id="columnas">
      <!-- Resultados de buscar_activos: solo código, dirección y municipio -->
      <section class="bloque aparece-3" id="resultados">
        <div class="bloque-cabecera">
          <div>
            <p class="eyebrow">Resultados</p>
            <p class="meta" id="meta-busqueda" aria-live="polite"></p>
          </div>
          <span class="registrada" id="aviso-registrada" title="Cada búsqueda queda apuntada en el registro de actividad" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Búsqueda registrada
          </span>
        </div>
        <table>
          <thead><tr><th>Código</th><th>Dirección</th><th>Municipio</th><th></th></tr></thead>
          <tbody id="filas"></tbody>
        </table>
      </section>

      <!-- La ficha del activo elegido (consultar_activo), paso 3.
           Sin activo elegido queda un hueco; al elegir uno, la ficha se despliega de izquierda a derecha. -->
      <div class="columna-ficha">
        <div class="hueco aparece-3" id="hueco-ficha">
          <div>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h9v14H6V8z"/><path d="M9 5v3H6"/><path d="M9 12h6M9 15h4"/></svg>
            Elige un activo de la lista para ver su ficha.
          </div>
        </div>
        <aside class="bloque ficha" id="ficha" aria-live="polite" hidden></aside>
      </div>
    </div>

    <!-- Lo que ve quien no tiene la sección Activos -->
    <section class="bloque sin-acceso aparece-2" id="sin-acceso" hidden>
      <p class="eyebrow">Sin acceso</p>
      <h2>No tienes acceso a Activos</h2>
      <p class="texto-suave">Tu perfil no incluye esta sección. Si la necesitas, pídesela a un administrador.</p>
      <dl class="permisos">
        <dt>Lees</dt>
        <dd id="secciones-lector"></dd>
      </dl>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="activos.js"></script>
</body>
</html>
